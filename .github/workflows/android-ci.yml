name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and compile NuvioTV Custom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI-only local properties
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://ci.invalid.example' \
            'NUVIO_SUPABASE_ANON_KEY=ci-placeholder' \
            > local.properties

      - name: Run focused unit tests
        run: ./gradlew :app:testFullBenchmarkUnitTest --tests 'com.nuvio.tv.ui.screens.player.PostPlayRecommendationStateTest' --no-daemon

      - name: Compile benchmark APK
        run: ./gradlew :app:assembleFullBenchmark --no-daemon
